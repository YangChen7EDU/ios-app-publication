name: GPACalculator
options:
  bundleIdPrefix: com.andychen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set to your Apple Developer Team ID before archiving.
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
targets:
  GPACalculator:
    type: application
    platform: iOS
    sources: [GPACalculator]
    info:
      path: GPACalculator/Info.plist
      properties:
        CFBundleDisplayName: GPA Calculator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andychen.gpacalculator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  GPACalculatorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GPACalculatorTests]
    dependencies:
      - target: GPACalculator
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GPACalculator:
    build:
      targets:
        GPACalculator: all
    test:
      targets: [GPACalculatorTests]
